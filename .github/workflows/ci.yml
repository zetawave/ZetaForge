name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: zeta CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix zeta-cli
      - run: npm test --prefix zeta-cli
      - run: npm run lint --prefix zeta-cli

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # No install step: the site has no dependencies.
      - name: Build the site
        working-directory: zetaforge-doc
        run: node build.mjs
      - name: Check every internal link resolves
        working-directory: zetaforge-doc
        run: node scripts/check-links.mjs

  runtime:
    name: runtime and builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: app
        run: ./gradlew :runtime:test --console=plain
      - name: Build the contract and a demo plugin
        working-directory: app
        run: ./gradlew :plugin-api:apiJar :plugins:retrofit-demo:buildZetaPlugin --console=plain

  end-to-end:
    name: build a plugin with the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - name: Install an SDK platform to compile against
        run: sdkmanager "platforms;android-35"

      - name: Build the contract and stage the CLI assets
        run: |
          node scripts/gradle.mjs :plugin-api:apiJar
          node scripts/sync-assets.mjs

      - run: npm ci --prefix zeta-cli

      # The real proof: scaffold a plugin from nothing and package it. Running it
      # needs a device, which is covered by the emulator job below.
      - name: Scaffold, build and inspect
        run: |
          node zeta-cli/bin/zeta.js new ci-plugin --author CI
          cd ci-plugin
          node ../zeta-cli/bin/zeta.js build
          node ../zeta-cli/bin/zeta.js test
          node ../zeta-cli/bin/zeta.js inspect dist/ci-plugin-1.0.0.zeta

  emulator:
    name: run a plugin on an emulator
    runs-on: ubuntu-latest
    # Hardware acceleration is not always available on hosted runners; this job
    # is allowed to fail without blocking, and is the one to check by hand when
    # the runtime changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - name: Build everything
        run: |
          node scripts/gradle.mjs :plugin-api:apiJar :host:assembleDebug
          node scripts/sync-assets.mjs
          npm ci --prefix zeta-cli

      - name: Scaffold and run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            node zeta-cli/bin/zeta.js host install --apk app/host/build/outputs/apk/debug/host-debug.apk
            node zeta-cli/bin/zeta.js new ci-plugin --author CI
            cd ci-plugin
            node ../zeta-cli/bin/zeta.js build
            node ../zeta-cli/bin/zeta.js install --no-build
            node ../zeta-cli/bin/zeta.js run
