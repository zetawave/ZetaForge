name: CI

# The fast half: everything that needs nothing but Node. Runs on every push and
# every pull request, and is expected to finish in well under a minute.
#
# Anything needing the Android SDK lives in android.yml, and the emulator — the
# slowest thing this project can run — lives in emulator.yml, which is not
# triggered by ordinary pushes at all.

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an older run pointless. Without this, pushing three fixes
# in a row leaves three full pipelines competing for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: zeta CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installed from the repository root: zeta-cli is an npm workspace and
      # has no lockfile of its own, so `npm ci --prefix zeta-cli` has nothing
      # to install from. The root lock covers every workspace.
      - run: npm ci
      - run: npm test --prefix zeta-cli
      - run: npm run lint --prefix zeta-cli

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # No install step: the site has no dependencies.
      - name: Build the site
        working-directory: zetaforge-doc
        run: node build.mjs
      - name: Check every internal link resolves
        working-directory: zetaforge-doc
        run: node scripts/check-links.mjs
