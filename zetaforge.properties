# ---------------------------------------------------------------------------
# ZetaForge — single source of truth for product identity.
# Changing a value here propagates to every module (see root build.gradle.kts).
# ---------------------------------------------------------------------------
zetaforge.productName=ZetaForge
zetaforge.appName=ZetaForge

# Namespaces / package names
zetaforge.host.package=com.zetaforge.app
zetaforge.sdk.package=com.zetaforge.sdk
zetaforge.runtime.package=com.zetaforge.runtime

# Host <-> plugin API contract version (see com.zetaforge.sdk.ZetaSdk.HOST_API_VERSION)
zetaforge.hostApiVersion=3

# Plugin artifact
zetaforge.pluginExtension=zeta
zetaforge.manifestFormatVersion=3

# Android toolchain
zetaforge.compileSdk=35
zetaforge.targetSdk=35
zetaforge.minSdk=26
zetaforge.jvmTarget=17

zetaforge.versionName=0.1.0
zetaforge.versionCode=1
